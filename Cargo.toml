[package]
name = "clip5"
version = "1.0.0"
edition = "2024"
description = "A tiny always-on-top window with five clipboard slots."
license = "MIT"
repository = "https://github.com/pbeens/Clip5"
homepage = "https://peter.beens.ca/Clip5/"
publish = false

[dependencies]
# glow (OpenGL) instead of the default wgpu keeps the executable small.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"

# Embeds the icon and version details in the Windows .exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Used by `cargo bundle` to build Clip5.app on macOS.
[package.metadata.bundle]
name = "Clip5"
identifier = "com.pbeens.clip5"
short_description = "Five always-on-top clipboard slots."
category = "public.app-category.utilities"
icon = [
    "assets/icon-32.png",
    "assets/icon-64.png",
    "assets/icon-128.png",
    "assets/icon-256.png",
    "assets/icon-512.png",
    "assets/icon-512@2x.png",
]
